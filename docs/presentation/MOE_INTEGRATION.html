<h1 id="moe-docking-integration">MOE Docking Integration</h1>
<h2 id="extending-the-docking-bench-platform">Extending the Docking Bench Platform</h2>
<p><strong>Multi-Engine Docking Platform</strong><br />
Smina · Gnina · MOE</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="2" data-paginate="true" data-theme="default" lang="en-US" data-marpit-pagination="2" style="--paginate:true;--theme:default;" data-marpit-pagination-total="44">
<h2 id="overview">Overview</h2>
<p><strong>Goal:</strong> Integrate MOE (Molecular Operating Environment) docking engine into existing smina/gnina platform</p>
<p><strong>Why MOE?</strong></p>
<ul>
<li>Commercial-grade docking with advanced placement algorithms</li>
<li>Induced-fit refinement options</li>
<li>Native pharmacophore constraint support</li>
<li>Alternative scoring functions (London dG, GBVI/WSA dG, Affinity dG)</li>
</ul>
<p><strong>Result:</strong> Unified interface for 3 docking engines with engine-specific optimizations</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="3" data-paginate="true" data-theme="default" lang="en-US" data-marpit-pagination="3" style="--paginate:true;--theme:default;" data-marpit-pagination-total="44">
<h2 id="architecture">Architecture</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code>Frontend (React-like vanilla JS)
    ↓
FastAPI Backend
    ├── smina/gnina wrapper (existing)
    └── MOE wrapper (new)
         ├── moe_dock.py       ← Python orchestration
         ├── moe_dock_template.svl ← SVL script template
         └── moebatch CLI       ← MOE batch processor
</code></pre>
<p><strong>Key decision:</strong> Template-based SVL generation instead of direct Python-MOE API</p>
<ul>
<li>Cross-platform compatibility</li>
<li>No MOE Python bindings required</li>
<li>Full control over docking parameters</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="4" data-paginate="true" data-theme="default" lang="en-US" data-marpit-pagination="4" style="--paginate:true;--theme:default;" data-marpit-pagination-total="44">
<h2 id="moe-batch-execution-flow">MOE Batch Execution Flow</h2>
<ol>
<li>
<p><strong>PDB → MOE conversion</strong> (inline SVL via <code>-exec</code>)</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-bash">moebatch -<span class="hljs-built_in">exec</span> <span class="hljs-string">&quot;ReadPDB &#x27;file.pdb&#x27;; WriteMOE &#x27;file.moe&#x27;; Close [];&quot;</span>
</code></pre>
</li>
<li>
<p><strong>Template instantiation</strong> (<code>build_svl_script()</code>)</p>
<ul>
<li>Replace placeholders: <code>{RECEPTOR_FILE}</code>, <code>{CENTER_X}</code>, etc.</li>
<li>Generate per-job SVL script</li>
</ul>
</li>
<li>
<p><strong>Docking execution</strong></p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-bash">moebatch -load script.svl -<span class="hljs-built_in">exec</span> <span class="hljs-string">&quot;main []&quot;</span>
</code></pre>
</li>
<li>
<p><strong>Export to SDF</strong> (unified format for all engines)</p>
</li>
</ol>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="5" data-paginate="true" data-theme="default" lang="en-US" data-marpit-pagination="5" style="--paginate:true;--theme:default;" data-marpit-pagination-total="44">
<h2 id="svl-script-template">SVL Script Template</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-svl">#svl
function Open; function Close; function Atoms; 
function Dock; function db_ExportSD; function ph4_aType;

global function main []
    local site_atoms, rec, lig, site, opt, ph4_data;
    
    Open '{RECEPTOR_FILE}';
    all_atoms = Atoms [];
    protein_atoms = all_atoms | aResidue all_atoms &lt;&gt; '';
    
    distances = sqrt add pow [sub [aPos protein_atoms, 
                [{CENTER_X}, {CENTER_Y}, {CENTER_Z}]], 2];
    site_atoms = protein_atoms | distances &lt;= {SITE_RADIUS};
    
    rec = [type: 'MOE', atom_sel: protein_atoms];
    lig = [type: 'SD File', file: '{LIGAND_FILE}'];
    
    // Pharmacophore support
    ph4_data = [];
    if '{PH4_FILE}' &lt;&gt; '' then
        ph4_data = ph4_aType '{PH4_FILE}';
    endif;
    
    opt = [run_mode: 'run', placement: '{PLACEMENT}', 
           rescoring: '{SCORING}', refine: '{REFINEMENT}', 
           maxpose: {NUM_POSES}, ph4: ph4_data];
    
    Dock [rec, site, lig, '{OUTPUT_MDB}', opt];
    db_ExportSD ['{OUTPUT_MDB}', '{OUTPUT_SDF}'];
    Close [];
endfunction
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="6" data-paginate="true" data-theme="default" lang="en-US" data-marpit-pagination="6" style="--paginate:true;--theme:default;" data-marpit-pagination-total="44">
<h2 id="auto-detection-features">Auto-Detection Features</h2>
<h3 id="binding-site-auto-detection">Binding Site Auto-Detection</h3>
<p><strong>Problem:</strong> User shouldn't manually define binding site for co-crystallized structures</p>
<p><strong>Solution:</strong> Extract HETATM ligands from PDB, use center + 10Å radius</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python"><span class="hljs-keyword">if</span> auto_detect_site <span class="hljs-keyword">and</span> receptor.suffix.lower() == <span class="hljs-string">&#x27;.pdb&#x27;</span>:
    het_ligands = prep.list_het_ligands(pdb_text, min_atoms=<span class="hljs-number">4</span>)
    site_ligand = <span class="hljs-built_in">next</span>((lig <span class="hljs-keyword">for</span> lig <span class="hljs-keyword">in</span> het_ligands <span class="hljs-keyword">if</span> <span class="hljs-keyword">not</span> lig.is_ion), <span class="hljs-literal">None</span>)
    <span class="hljs-keyword">if</span> site_ligand:
        center = <span class="hljs-built_in">tuple</span>(site_ligand.center)
        size = (<span class="hljs-number">20.0</span>, <span class="hljs-number">20.0</span>, <span class="hljs-number">20.0</span>)  <span class="hljs-comment"># 10Å radius = 20Å box</span>
</code></pre>
<p><strong>Benefit:</strong> One-click docking for PDB structures with bound ligands</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="7" data-paginate="true" data-theme="default" lang="en-US" data-marpit-pagination="7" style="--paginate:true;--theme:default;" data-marpit-pagination-total="44">
<h2 id="binding-site-definition">Binding Site Definition</h2>
<p><strong>MOE requires atom selection, not just box coordinates</strong></p>
<p>Initial approach (failed):</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-svl">site = [type: 'box', center: [x,y,z], size: [sx,sy,sz]]
// <img class="emoji" draggable="false" alt="❌" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/274c.svg" data-marp-twemoji=""/> Poses scattered everywhere
</code></pre>
<p>Working approach:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-svl">distances = sqrt add pow [sub [aPos protein_atoms, [x,y,z]], 2];
site_atoms = protein_atoms | distances &lt;= radius;
site = site_atoms;  // actual atom selection
// <img class="emoji" draggable="false" alt="✅" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/2705.svg" data-marp-twemoji=""/> Poses confined to binding pocket
</code></pre>
<p><strong>Learning:</strong> MOE site definition semantics differ from smina's geometric box</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="8" data-paginate="true" data-theme="default" lang="en-US" data-marpit-pagination="8" style="--paginate:true;--theme:default;" data-marpit-pagination-total="44">
<h2 id="pharmacophore-constraints">Pharmacophore Constraints</h2>
<h3 id="sminagnina-approach">Smina/Gnina Approach</h3>
<ul>
<li>Manual point-based constraints (H-bond donor/acceptor, positional)</li>
<li>Post-docking filtering and reranking</li>
<li>No search bias (constraints don't guide docking)</li>
</ul>
<h3 id="moe-approach">MOE Approach</h3>
<ul>
<li>Native .ph4 file support</li>
<li>Upload pharmacophore query file</li>
<li>Constraints guide placement algorithm</li>
<li>Only available with &quot;Pharmacophore&quot; placement method</li>
</ul>
<p><strong>Implementation:</strong></p>
<ul>
<li>Added <code>/api/pharmacophore/upload</code> endpoint</li>
<li>Store .ph4 files in <code>runs/pharmacophores/{ph4_id}.ph4</code></li>
<li>Pass to SVL via <code>ph4_aType</code> function</li>
<li>UI shows .ph4 upload only when MOE engine selected</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="9" data-paginate="true" data-theme="default" lang="en-US" data-marpit-pagination="9" style="--paginate:true;--theme:default;" data-marpit-pagination-total="44">
<h2 id="parameter-mapping">Parameter Mapping</h2>
<table>
<thead>
<tr>
<th>Concept</th>
<th>Smina/Gnina</th>
<th>MOE</th>
</tr>
</thead>
<tbody>
<tr>
<td><strong>Search effort</strong></td>
<td>exhaustiveness (1-64)</td>
<td>placement method</td>
</tr>
<tr>
<td><strong>Refinement</strong></td>
<td>--minimize flag</td>
<td>refine: Rigid/Induced Fit/None</td>
</tr>
<tr>
<td><strong>Scoring</strong></td>
<td>vina, vinardo, ad4</td>
<td>London dG, GBVI/WSA dG, Affinity dG</td>
</tr>
<tr>
<td><strong>Constraints</strong></td>
<td>post-filter points</td>
<td>native .ph4 pharmacophore</td>
</tr>
<tr>
<td><strong>Poses kept</strong></td>
<td>num_modes</td>
<td>maxpose</td>
</tr>
<tr>
<td><strong>Energy range</strong></td>
<td>energy_range</td>
<td>(implicit in rescoring)</td>
</tr>
</tbody>
</table>
<p><strong>Challenge:</strong> Different paradigms require conditional UI/backend logic</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="10" data-paginate="true" data-theme="default" lang="en-US" data-marpit-pagination="10" style="--paginate:true;--theme:default;" data-marpit-pagination-total="44">
<h2 id="technical-challenges-solved">Technical Challenges Solved</h2>
<h3 id="1-svl-syntax-errors">1. SVL Syntax Errors</h3>
<p><strong>Problem:</strong> &quot;Expressions only allowed in functions&quot; with inline <code>-exec</code></p>
<p><strong>Solution:</strong> Use script file + <code>-load</code> then <code>-exec &quot;main []&quot;</code> pattern</p>
<ul>
<li>Forward declare functions at top</li>
<li>Wrap all logic in <code>global function main []</code></li>
</ul>
<h3 id="2-pdb-conversion-failures">2. PDB Conversion Failures</h3>
<p><strong>Problem:</strong> Empty error messages from moebatch</p>
<p><strong>Solution:</strong> Check both stderr AND stdout, add fallback message</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python">stderr = (e.stderr <span class="hljs-keyword">or</span> e.stdout <span class="hljs-keyword">or</span> <span class="hljs-string">&quot;&quot;</span>).strip()
<span class="hljs-keyword">raise</span> MoeDockingFailed(<span class="hljs-string">f&quot;moebatch error: <span class="hljs-subst">{stderr <span class="hljs-keyword">or</span> <span class="hljs-string">&#x27;unknown error&#x27;</span>}</span>&quot;</span>)
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="11" data-paginate="true" data-theme="default" lang="en-US" data-marpit-pagination="11" style="--paginate:true;--theme:default;" data-marpit-pagination-total="44">
<h2 id="technical-challenges-solved-cont">Technical Challenges Solved (cont.)</h2>
<h3 id="3-site-selection-expression">3. Site Selection Expression</h3>
<p><strong>Problem:</strong> <code>'protein'</code> keyword not recognized in MOE</p>
<p><strong>Solution:</strong> Manual residue-based selection</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-svl">protein_atoms = all_atoms | aResidue all_atoms &lt;&gt; '';
</code></pre>
<h3 id="4-pharmacophore-api-discovery">4. Pharmacophore API Discovery</h3>
<p><strong>Problem:</strong> <code>ph4_Read</code> function doesn't exist</p>
<p><strong>Solution:</strong> Use <code>ph4_aType</code> for atom-type pharmacophore queries</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-svl">function ph4_aType;  // declare first
ph4_data = ph4_aType '{PH4_FILE}';  // load .ph4 file
</code></pre>
<h3 id="5-config-path-inconsistency">5. Config Path Inconsistency</h3>
<p><strong>Problem:</strong> <code>config.RUNS</code> vs <code>config.RUNS_DIR</code> attribute errors</p>
<p><strong>Solution:</strong> Standardized on <code>config.RUNS_DIR</code> throughout codebase</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="12" data-paginate="true" data-theme="default" lang="en-US" data-marpit-pagination="12" style="--paginate:true;--theme:default;" data-marpit-pagination-total="44">
<h2 id="job-naming-convention">Job Naming Convention</h2>
<p><strong>Old system:</strong> Random UUID hex (<code>8146a68fa69e</code>)</p>
<p><strong>New system:</strong> <code>{engine}_{yyyymmddhhmmss}</code></p>
<ul>
<li><code>moe_20261001143530</code></li>
<li><code>smina_20261001144215</code></li>
<li><code>gnina_20261001150033</code></li>
</ul>
<p><strong>Benefits:</strong></p>
<ul>
<li>Instantly identify docking engine</li>
<li>Chronological sorting</li>
<li>Human-readable job directories</li>
<li>Easier debugging and log review</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="13" data-paginate="true" data-theme="default" lang="en-US" data-marpit-pagination="13" style="--paginate:true;--theme:default;" data-marpit-pagination-total="44">
<h2 id="frontend-integration">Frontend Integration</h2>
<h3 id="engine-selection">Engine Selection</h3>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-javascript">$(<span class="hljs-string">&quot;engineSel&quot;</span>).<span class="hljs-property">onchange</span> = <span class="hljs-function">() =&gt;</span> {
  <span class="hljs-keyword">const</span> isMoe = $(<span class="hljs-string">&quot;engineSel&quot;</span>).<span class="hljs-property">value</span> === <span class="hljs-string">&quot;moe&quot;</span>;
  
  <span class="hljs-comment">// Show/hide engine-specific params</span>
  $(<span class="hljs-string">&quot;moeParamsRow&quot;</span>).<span class="hljs-property">style</span>.<span class="hljs-property">display</span> = isMoe ? <span class="hljs-string">&quot;grid&quot;</span> : <span class="hljs-string">&quot;none&quot;</span>;
  $(<span class="hljs-string">&quot;sminaGninaParamsRow&quot;</span>).<span class="hljs-property">style</span>.<span class="hljs-property">display</span> = isMoe ? <span class="hljs-string">&quot;none&quot;</span> : <span class="hljs-string">&quot;flex&quot;</span>;
  
  <span class="hljs-comment">// Switch constraint UI</span>
  $(<span class="hljs-string">&quot;sminaGninaConstraints&quot;</span>).<span class="hljs-property">style</span>.<span class="hljs-property">display</span> = isMoe ? <span class="hljs-string">&quot;none&quot;</span> : <span class="hljs-string">&quot;block&quot;</span>;
  $(<span class="hljs-string">&quot;moeConstraints&quot;</span>).<span class="hljs-property">style</span>.<span class="hljs-property">display</span> = isMoe ? <span class="hljs-string">&quot;block&quot;</span> : <span class="hljs-string">&quot;none&quot;</span>;
  
  <span class="hljs-title function_">updateScoringOptions</span>(engine);
};
</code></pre>
<p><strong>Result:</strong> Context-aware UI that shows only relevant options per engine</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="14" data-paginate="true" data-theme="default" lang="en-US" data-marpit-pagination="14" style="--paginate:true;--theme:default;" data-marpit-pagination-total="44">

<h2 id="user-workflow">User Workflow</h2>
<h3 id="standard-moe-docking">Standard MOE Docking</h3>
<ol>
<li>Fetch/upload PDB receptor (auto-detects binding site from HETATM)</li>
<li>Upload ligand SMILES or SDF</li>
<li>Select <strong>MOE</strong> engine</li>
<li>Choose placement method (default: Triangle Matcher)</li>
<li>Choose refinement (default: Rigid Receptor)</li>
<li>Select scoring function</li>
<li>Run</li>
</ol>
<h3 id="pharmacophore-constrained-docking">Pharmacophore-Constrained Docking</h3>
<p>1-2. Same as above<br />
3. Select <strong>MOE</strong> engine<br />
4. <strong>Upload .ph4 file</strong> in pharmacophore panel<br />
5. Set placement to <strong>Pharmacophore</strong><br />
6. Configure refinement/scoring<br />
7. Run</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="16" data-marpit-scope-JeFdqdk8="" data-paginate="true" data-theme="default" lang="en-US" data-marpit-pagination="16" style="--paginate:true;--theme:default;" data-marpit-pagination-total="44">
<h2 id="whats-new">What's New</h2>

</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="17" data-paginate="true" data-theme="default" lang="en-US" data-marpit-pagination="17" style="--paginate:true;--theme:default;" data-marpit-pagination-total="44">
<h1 id="covalent-docking">Covalent Docking</h1>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="18" data-marpit-scope-mYMXSZyf="" data-paginate="true" data-theme="default" lang="en-US" data-marpit-pagination="18" style="--paginate:true;--theme:default;" data-marpit-pagination-total="44">
<h2 id="covalent-docking-overview">Covalent Docking: Overview</h2>
<p><strong>Inputs (MOE engine only):</strong></p>
<ul>
<li>Target residue as <code>chain:RES:num</code> — typed, or <strong>Pick</strong> an atom in the 3D viewer</li>
<li>Reaction: one of 22 built-in templates (<code>$MOE/lib/reactions/covalent/*.rxn</code>) or an uploaded <code>.rxn</code> (draw in Ketcher, export)</li>
</ul>
<p><strong>Nucleophile per residue:</strong> CYS SG · SER OG · THR OG1 · TYR OH · LYS NZ</p>
<table>
<thead>
<tr>
<th>Target</th>
<th>Common templates</th>
</tr>
</thead>
<tbody>
<tr>
<td>Cys</td>
<td><code>michael_acceptor_s</code>, <code>epoxide_s</code>, <code>alpha_halocarbonyl_s</code>, <code>vinyl_sulfone_s</code></td>
</tr>
<tr>
<td>Ser/Thr</td>
<td><code>michael_acceptor_o</code>, <code>epoxide_o</code>, <code>carbonyl_o</code></td>
</tr>
<tr>
<td>Lys</td>
<td><code>sulfonyl_halide</code>, <code>carbamate</code></td>
</tr>
<tr>
<td>Tyr</td>
<td><code>sulfonyl_halide_tyr</code></td>
</tr>
</tbody>
</table>
<p><strong>Results:</strong> each pose's MOE scores plus the ligand group it is bonded through</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="19" data-marpit-scope-2kq4JivY="" data-paginate="true" data-theme="default" lang="en-US" data-marpit-pagination="19" style="--paginate:true;--theme:default;" data-marpit-pagination-total="44">
<h2 id="covalent-docking-matching-the-guis-options">Covalent Docking: Matching the GUI's Options</h2>
<p><strong>First attempt:</strong> made-up keys that MOE silently ignored</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-svl">opt.covalent = 1; opt.rxn_file = '...'; opt.tether = 'A:CYS:189';   // <img class="emoji" draggable="false" alt="❌" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/274c.svg" data-marp-twemoji=""/> no effect
</code></pre>
<p><strong>Fix:</strong> copy the structure from the GUI-generated <code>run.sh</code></p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-svl">opt.dockmode      = 'Covalent';
opt.placement     = 'Covalent Docking';
opt.placement_opt = [rxnFile: '&lt;file&gt;.rxn', rxsite: 'asel', mode: 'Covalent', ...];
opt.refine_opt    = [fixrec: 'Fix', tether: 10, ...];   // tether = force constant
opt.rxsite        = rxsite_atoms(1);                     // the nucleophile atom
</code></pre>
<p><strong>Selecting the reactive atom:</strong></p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-svl">rxsite_atoms = protein_atoms | rUID aResidue protein_atoms == 294
                             and aName protein_atoms == 'OG';
</code></pre>
<ul>
<li><code>aResidue</code> returns residue <em>keys</em>; <code>rUID</code> gives the PDB residue number</li>
<li>Chain is ignored: MOE renames chains on PDB import</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="20" data-paginate="true" data-theme="default" lang="en-US" data-marpit-pagination="20" style="--paginate:true;--theme:default;" data-marpit-pagination-total="44">
<h2 id="covalent-docking-the-reactive-site-bug">Covalent Docking: The Reactive-Site Bug</h2>
<p><strong>Symptom:</strong> <code>Reaction did not match protein</code> on unprepared receptors</p>
<p><strong>Root cause:</strong> <code>Dock</code> runs <code>Add_H</code> internally <strong>after</strong> <code>opt.rxsite</code> is resolved to an atom index<br />
→ added hydrogens shift the indices → rxsite points at an unrelated atom</p>
<p><strong>Fix:</strong> add hydrogens up front, before taking any index</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-svl">Open '{RECEPTOR_FILE}';
Add_H Atoms [];          // keeps opt.rxsite stable
all_atoms = Atoms [];
</code></pre>
<p><strong>How it was found:</strong> reran the GUI's <code>run.sh</code>, swapped in our inputs one at a time, and printed state from an instrumented copy of <code>dock_u.svl</code>. Guessing at option changes didn't find it.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="21" data-marpit-scope-SeHqa8nt="" data-paginate="true" data-theme="default" lang="en-US" data-marpit-pagination="21" style="--paginate:true;--theme:default;" data-marpit-pagination-total="44">
<h2 id="covalent-docking-ligand-chemistry-matters">Covalent Docking: Ligand Chemistry Matters</h2>
<p><strong>Case study: 3PBS (ligand AZR on Ser294)</strong></p>
<ul>
<li>The PDB CCD SMILES is the <em>bound adduct</em>, so the reacting carbon is an aldehyde</li>
<li>The ester-forming reaction needs a carboxylic acid, so MOE acylated a side-chain carboxylate instead</li>
</ul>
<p><strong>Safeguards added (<code>covalent_check.py</code>):</strong></p>
<ul>
<li><code>reactant_warning()</code> warns when the ligand matches the reaction's reactant <strong>0 or &gt;1 times</strong></li>
<li><code>acid_form_from_link()</code> rebuilds a LINKed acyl adduct as its acid form for self-docking</li>
<li>Detects which ligand group each pose is attached through</li>
</ul>
<p><strong>Rescoring changes pose quality:</strong></p>
<table>
<thead>
<tr>
<th>Rescoring</th>
<th>Top-pose RMSD to crystal (3PBS)</th>
</tr>
</thead>
<tbody>
<tr>
<td>London dG</td>
<td>7.6 Å</td>
</tr>
<tr>
<td>GBVI/WSA dG (default)</td>
<td>1.1–1.4 Å</td>
</tr>
</tbody>
</table>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="22" data-paginate="true" data-theme="default" lang="en-US" data-marpit-pagination="22" style="--paginate:true;--theme:default;" data-marpit-pagination-total="44">
<h1 id="2d-protein%E2%80%93ligand-interaction-diagram">2D Protein–Ligand Interaction Diagram</h1>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="23" data-marpit-scope-f8Q4aHON="" data-paginate="true" data-theme="default" lang="en-US" data-marpit-pagination="23" style="--paginate:true;--theme:default;" data-marpit-pagination-total="44">
<h2 id="ligand-interactions-diagram">Ligand Interactions Diagram</h2>
<p><strong>MOE's 2D diagram (GUI: Ligand Interactions panel) drawn headless in <code>moebatch</code></strong></p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-svl">grob   = DrawLigandInteractions [[lig], [rec], opt];
legend = call ['_DrawLigandInteractionsLegend', [[], []], 'prolig2d.svl'];
gr_fwrite [file, &lt;grob + legend stacked&gt;, 'image/svg+xml', [0,0,1,1]];
</code></pre>
<ul>
<li>About 1 s per diagram, no GUI needed</li>
<li><code>$MOE/svl/run/*.svl</code> functions aren't loaded in batch → call them with <code>call [...]</code></li>
</ul>
<p><strong>When diagrams are drawn:</strong></p>
<ul>
<li><strong>MOE jobs:</strong> one per pose, inside the docking run, while the receptor is still loaded<br />
→ <code>poses/&lt;ligand&gt;_poses_lid_&lt;n&gt;.svg</code>, <strong>no extra license checkout</strong></li>
<li><strong>smina/gnina or older MOE jobs:</strong> drawn on demand (short queued <code>moebatch</code> run), then cached</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="24" data-marpit-scope-VHYpRY9R="" data-paginate="true" data-theme="default" lang="en-US" data-marpit-pagination="24" style="--paginate:true;--theme:default;" data-marpit-pagination-total="44">
<h2 id="ligand-interactions-serving--fallback">Ligand Interactions: Serving &amp; Fallback</h2>
<p><strong>Endpoint:</strong> <code>GET .../interactions2d.svg?style=auto|moe|prolif</code></p>
<ul>
<li><code>X-Diagram-Source</code> response header reports which renderer was used</li>
<li>If MOE fails or isn't installed → falls back to the <strong>ProLIF</strong> diagram</li>
<li>MOE/ProLIF switch in the diagram panel</li>
</ul>
<p><strong>Browser fixes (<code>browser_svg()</code>):</strong></p>
<ul>
<li>Replaces MOE's embedded SVG font, which browsers ignore, with system sans-serif</li>
<li>Adds a white background (app panels are dark)</li>
</ul>
<p><strong>Example: DPP-4 / sitagliptin (1x70)</strong></p>
<ul>
<li>Neutral amine SMILES → almost no interactions shown</li>
<li><code>[NH3+]</code> → Glu206 H-bond and Glu205 ionic contact, matching the GUI</li>
<li>Ligands aren't protonated automatically, so write charged groups explicitly</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="25" data-paginate="true" data-theme="default" lang="en-US" data-marpit-pagination="25" style="--paginate:true;--theme:default;" data-marpit-pagination-total="44">
<h1 id="moe-license-queue">MOE License Queue</h1>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="26" data-paginate="true" data-theme="default" lang="en-US" data-marpit-pagination="26" style="--paginate:true;--theme:default;" data-marpit-pagination-total="44">
<h2 id="license-queue-the-problem">License Queue: The Problem</h2>
<p><strong>Site license:</strong> 6 MOE tokens; each <code>moebatch</code> run checks out 2</p>
<p><strong>Before:</strong> ligands docked in parallel on the shared thread pool</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code>ligand 1 <img class="emoji" draggable="false" alt="✅" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/2705.svg" data-marp-twemoji=""/>  ligand 2 <img class="emoji" draggable="false" alt="✅" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/2705.svg" data-marp-twemoji=""/>  ligand 3 <img class="emoji" draggable="false" alt="✅" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/2705.svg" data-marp-twemoji=""/>
ligand 4 <img class="emoji" draggable="false" alt="❌" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/274c.svg" data-marp-twemoji=""/>  Can't check out license ... Not enough tokens available
</code></pre>
<p>Also:</p>
<ul>
<li>Other users on the same license server compete for tokens</li>
<li>QuickPrep and on-demand diagrams also need <code>moebatch</code></li>
<li>Long MOE jobs blocked smina/gnina workers</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="27" data-marpit-scope-txizGAcM="" data-paginate="true" data-theme="default" lang="en-US" data-marpit-pagination="27" style="--paginate:true;--theme:default;" data-marpit-pagination-total="44">
<h2 id="license-queue-design">License Queue: Design</h2>
<p><strong>Every <code>moebatch</code> call goes through <code>moe_dock._run_moebatch</code>:</strong></p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code>docking ligands ───┐
QuickPrep ─────────┼──► semaphore (MOE_MAX_CONCURRENT) ──► moebatch
on-demand diagrams ┘                                          │
                         license checkout error? ◄────────────┘
                           yes → sleep MOE_LICENSE_RETRY, retry (≤ MOE_LICENSE_WAIT)
                           no  → done (other errors fail immediately)
</code></pre>
<ul>
<li><strong>Dedicated MOE thread pool</strong> (<code>JobManager._moe_pool</code>) sized to the cap; smina/gnina keep their own workers</li>
<li>Waiting ligands show status <strong>&quot;queued&quot;</strong> in the UI</li>
<li>Only license-checkout failures are retried (every 30 s, up to 3600 s by default)</li>
<li>Each ligand gets its own receptor <code>.moe</code> copy, which fixes a shared-file race</li>
<li><code>moebatch</code> runs from the job folder so Dock's scratch <code>.mdb</code> files stay out of the repo root</li>
</ul>
</section>

<h2 id="license-queue-configuration">License Queue: Configuration</h2>

<tr>
<th>Variable</th>
<th>Default</th>
<th>Meaning</th>

</thead>

</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="29" data-marpit-scope-Z8ucJkip="" data-paginate="true" data-theme="default" lang="en-US" data-marpit-pagination="29" style="--paginate:true;--theme:default;" data-marpit-pagination-total="44">
<h2 id="moe-quickprep">MOE QuickPrep</h2>
<p><strong>Receptor panel button → <code>POST /api/receptor/{id}/quickprep</code></strong></p>
<ul>
<li>Batch entry point: <code>_LIGX_Execute</code> (the QuickPrep panel's OK action), using your saved QuickPrep settings</li>
<li>Structure Preparation → Protonate3D → remove distant waters → tethered minimization</li>
<li><strong>Selected site ligand goes in the <code>LIGX_LIGAND</code> collection</strong>: it defines the flexible region. With no ligand, every atom is fixed and minimization does nothing</li>
<li>Prepared receptor is stored as a new receptor, shown in the viewer, and used for docking (its hydrogens are kept)</li>
</ul>
<p><strong>Report:</strong> hydrogens added, residues built, waters removed, atom shifts, non-default protonation states (site residues first)</p>
<p><strong>DPP-4 1x70:</strong> His740 → HIP, Asp663 → ASH, ~70 heavy atoms move &gt; 0.5 Å · ~40 s on a cleaned receptor</p>
</section>

<li><strong>GBVI/WSA dG</strong> — Generalized Born/volume integral with weighted surface area</li>

<li><strong>ASE</strong> — Atomic solvation energy</li>
</ul>
<h3 id="cross-engine-compatibility">Cross-Engine Compatibility</h3>
<p>MOE can also use smina scoring via backend wrapper:</p>
<ul>

<h2 id="file-cleanup-strategy">File Cleanup Strategy</h2>
<p><strong>Generated per job:</strong></p>
<ul>
<li><code>{ligand}_dock.svl</code> — Generated SVL script</li>
<li><code>{ligand}_poses.mdb</code> — MOE database (temp)</li>
<li><code>{ligand}_poses.sdf</code> — Final output (kept)</li>
</ul>
<p><strong>Auto-cleanup on success:</strong></p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python"><span class="hljs-keyword">if</span> script_path.exists():
    script_path.unlink()
<span class="hljs-keyword">if</span> out_mdb.exists():
    out_mdb.unlink()
<span class="hljs-keyword">if</span> receptor_for_moe != receptor:  <span class="hljs-comment"># converted PDB</span>
    receptor_for_moe.unlink()
</code></pre>
<p><strong>Kept on failure:</strong> Script file preserved for debugging</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code>(script: /path/to/job/poses/ligand_dock.svl)
</code></pre>
</section>

<h2 id="error-handling">Error Handling</h2>
<h3 id="graceful-degradation">Graceful Degradation</h3>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python"><span class="hljs-keyword">try</span>:
    moebatch = find_moebatch()
<span class="hljs-keyword">except</span> MoeBatchNotFound:
    <span class="hljs-comment"># MOE engine disabled in UI, not an error</span>
    engines_available[<span class="hljs-string">&#x27;moe&#x27;</span>] = <span class="hljs-literal">False</span>
</code></pre>
<h3 id="informative-error-messages">Informative Error Messages</h3>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python"><span class="hljs-keyword">if</span> proc.returncode != <span class="hljs-number">0</span>:
    tail = (proc.stderr <span class="hljs-keyword">or</span> proc.stdout <span class="hljs-keyword">or</span> <span class="hljs-string">&quot;&quot;</span>).strip().splitlines()
    <span class="hljs-keyword">raise</span> MoeDockingFailed(
        <span class="hljs-string">f&quot;<span class="hljs-subst">{tail[-<span class="hljs-number">1</span>]}</span> (script: <span class="hljs-subst">{script_path}</span>)&quot;</span>
    )
</code></pre>
<p><strong>User sees:</strong> Exact MOE error + script path for debugging</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="36" data-paginate="true" data-theme="default" lang="en-US" data-marpit-pagination="36" style="--paginate:true;--theme:default;" data-marpit-pagination-total="44">
<h2 id="configuration">Configuration</h2>
<h3 id="moe-discovery">MOE Discovery</h3>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python"><span class="hljs-keyword">def</span> <span class="hljs-title function_">find_moebatch</span>() -&gt; <span class="hljs-type">Optional</span>[<span class="hljs-built_in">str</span>]:
    <span class="hljs-comment"># 1. Environment variable</span>
    <span class="hljs-keyword">if</span> path := os.environ.get(<span class="hljs-string">&quot;MOE_BATCH&quot;</span>):
        <span class="hljs-keyword">return</span> path <span class="hljs-keyword">if</span> Path(path).exists() <span class="hljs-keyword">else</span> <span class="hljs-literal">None</span>
    
    <span class="hljs-comment"># 2. Common install locations (macOS)</span>
    <span class="hljs-keyword">for</span> base <span class="hljs-keyword">in</span> [<span class="hljs-string">&quot;/Applications&quot;</span>, Path.home() / <span class="hljs-string">&quot;Applications&quot;</span>]:
        <span class="hljs-keyword">for</span> moe_dir <span class="hljs-keyword">in</span> <span class="hljs-built_in">sorted</span>(base.glob(<span class="hljs-string">&quot;moe*&quot;</span>), reverse=<span class="hljs-literal">True</span>):
            moebatch = moe_dir / <span class="hljs-string">&quot;bin&quot;</span> / <span class="hljs-string">&quot;moebatch&quot;</span>
            <span class="hljs-keyword">if</span> moebatch.exists():
                <span class="hljs-keyword">return</span> <span class="hljs-built_in">str</span>(moebatch)
    
    <span class="hljs-keyword">return</span> <span class="hljs-literal">None</span>
</code></pre>
<p><strong>Flexibility:</strong> Works with any MOE version, no hardcoded paths</p>
</section>

<li><strong>Error message archaeology</strong> — check stdout when stderr empty</li>
<li><strong>Bisect against the GUI's <code>run.sh</code></strong>, don't guess option changes</li>
<li><strong>Check ligand chemistry first</strong> when covalent results differ</li>
</ol>
<h3 id="architectural">Architectural</h3>
<ol>
<li><strong>Engine abstraction layer</strong> critical for multi-engine support</li>
<li><strong>Conditional UI rendering</strong> keeps interface clean</li>

<li><strong>Unified SDF output</strong> enables cross-engine comparison</li>

<h3 id="run-svl-script-manually">Run SVL script manually</h3>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-bash">/Applications/moe2024.0604/bin/moebatch \

<h3 id="common-errors">Common errors</h3>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code>&quot;Function 'X' does not exist&quot;
→ Add function declaration at top

&quot;Expressions only allowed in functions&quot;
→ Wrap code in global function main []

&quot;Site selection expression is invalid&quot;
→ Use atom selection, not geometric box

&quot;This placement method requires a pharmacophore&quot;
→ Either upload .ph4 or change placement method

&quot;Reaction did not match protein&quot;
→ rxsite index shifted (Add_H before taking indices) or wrong residue

&quot;Not enough tokens available&quot;
→ Handled by the license queue; lower MOE_MAX_CONCURRENT
</code></pre>
